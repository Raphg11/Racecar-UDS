<!DOCTYPE html>
<html lang="fr-CA">
 
<head>
    <!-- Required meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
 
    <!-- CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
 
    <!-- JavaScript - Import Dependencies -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="js/jquery-3.3.1.slim.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/virtualjoystick.js"></script>
    <script src="js/roslib.min.js"></script> <!-- rosbridge -->
 
    <title>GRO525 | Page du Racecar</title>
</head>
 
<body>
    <!-- Menu BEGIN-->
    <div class="collapse" id="navbarToggleExternalContent">
        <div class="bg-dark p-4">
            <h6 class="text-white h4">Configuration</h6>
            <label class="text-white">ROS master IP:</label>
            <input type="text" id="rosMasterIp" class="form-control mb-2">
            <button id="btnConnect" class="btn btn-secondary">Connecter!</button>
        </div>
    </div>
 
    <nav class="navbar navbar-dark bg-dark">
        <div>
            <div class="row">
                <button class="navbar-toggler" type="button" data-toggle="collapse"
                    data-target="#navbarToggleExternalContent">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="text-white h3 p-2">
 
                    Utilisateur : <span id="utilisateurracecar">Utilisateur</span>
                </div>
                <div class="text p-3" id="connectionracecarstate" >   En attente de connexion au racecar ...</div>
                <button id="deconnectionbtn" class="btn-white" >Déconnexion</button>
            </div>
        </div>
    </nav>
    <!-- Menu END-->
 
    <!-- Main layout BEGIN-->
    <div class="container-fluid">
        <div class="row">
            <div class="col-12 col-md-4 p-2">
                <div class="card shadow-sm mb-4">
                    <h2 class="text-black h12">Statut</h2>
                    <textarea id="boiteStatut" class="form-control mb-2" rows="5" readonly></textarea>
 
                    <button id="btnEffacer"class="btn btn-dark">Effacer</button>
 
                </div>
 
                <div class="card shadow-sm pb-2 p-2">
                    <h2 class="text-black h12">Controle</h2>
                    <div class="row justify-content-center">
                   
                        <button id="btnAvancez" class="btn btn-dark mx-2">Avancer</button>
                        <button id="btnArretez" class="btn btn-dark mx-2">Arreter</button>
                    </div>
                </div>
 
               
            </div>
 
            <div class="col-12 col-md-8">
 
                <h2 class="text-black h12">Camera</h2>
 
                <img id="fluxCamera" src="http://192.168.137.63:8080/stream?topic=/racecar/camera/image_raw" class="img-fluid border w-100" alt="Flux Caméra">
                <div id="zoneJoystick" class="d-flex justify-content-center align-items-center rounded" style="width: 50%; height: 200px; background-color: #e9ecef; border: 2px dashed #6c757d; position: relative; touch-action: none;">
   
 
            </div>
 
           
 
        </div>
 
       
 
 
    </div>
    <!-- Main layout END-->
 
    <!-- vvv Use this file for your scripts vvv-->
    <script type="text/javascript" src="js/main.js"></script>
</body>
 
</html>
